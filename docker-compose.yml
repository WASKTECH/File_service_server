# docker-compose.yml
# Multi-container orchestration for PostgreSQL and File Service API
# Start cluster: docker compose up -d --build
# Stop cluster:  docker compose down

services:
  db:
    image: postgres:16-alpine
    container_name: file-service-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fileapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-filedb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fileapi} -d ${POSTGRES_DB:-filedb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-service-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fileapi}:${POSTGRES_PASSWORD:-devpassword123}@db:5432/${POSTGRES_DB:-filedb}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: